schema_version: 4
run_name: germany-da-afrr

# Germany (DE-LU) day-ahead + capacity-only asymmetric aFRR. See docs/germany.md.
# aFRR capacity is pay-as-bid; the benchmark price is the published German average awarded price.
# Activation energy (PICASSO) is not modelled, so no activation inputs are configured: the adapter
# supplies zero activation series. The block prices here are synthetic illustrative values
# (regelleistung.net results are not redistributed); one file holds both directions.
market:
  id: germany

workflow: da_plus_afrr

forecast_provider:
  name: persistence

timing:
  timezone: Europe/Berlin
  resolution_minutes: 15
  rebalance_cadence_minutes: 15
  execution_lock_intervals: 1
  day_ahead_gate_closure_local: "12:00"
  delivery_start_date: 2025-10-01
  delivery_end_date: 2025-10-01

site:
  id: germany-afrr-demo-site
  poi_import_limit_mw: 1.0
  poi_export_limit_mw: 1.0

assets:
  - id: de-bess-1
    kind: battery
    battery:
      name: demo_bess_de_afrr
      power_mw: 1.0
      energy_mwh: 2.0
      initial_soc_mwh: 1.0
      terminal_soc_mwh: 1.0
      soc_min_mwh: 0.1
      soc_max_mwh: 1.9
      charge_efficiency: 0.95
      discharge_efficiency: 0.95
      connection_limit_mw: 1.0
      minimum_headroom_mwh: 0.0

degradation:
  mode: throughput_linear
  throughput_cost_eur_per_mwh: 4.0

data:
  day_ahead:
    actual_path: ../../data/germany_day_ahead_prices.csv
  afrr_capacity_up:
    actual_path: ../../data/germany_afrr_capacity_blocks.csv
  afrr_capacity_down:
    actual_path: ../../data/germany_afrr_capacity_blocks.csv

afrr:
  product_id: afrr_asymmetric
  # PQ rule for limited-energy reservoirs: 60 minutes of energy per marketed MW and direction.
  sustain_duration_minutes: 60
  settlement_mode: capacity_only
  activation_mode: none
  non_delivery_penalty_eur_per_mw: 0.0
  simplified_product_logic: true

artifacts:
  root_dir: ../../../artifacts/examples
  save_inputs: true
  save_plots: false
  save_forecast_snapshots: true
